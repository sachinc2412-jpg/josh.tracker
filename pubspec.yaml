name: tracker
description: Josh Tracker — habit & sprint tracker.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-512.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon-512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon-512.png